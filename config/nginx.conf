server {
    listen 80;
    server_name cj.dog;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    location = /cctv {
        root      /usr/share/nginx/html;
        try_files /cctv.html =404;
    }

    location = /hedgehog.png {
        root      /usr/share/nginx/html;
        try_files /hedgehog.png =404;
    }
}

server {
    listen 80;
    server_name dots.cj.dog;

    rewrite (.*) https://gitlab.com/codingjerk/dotfiles/-/raw/master/tools/install.sh;
}
